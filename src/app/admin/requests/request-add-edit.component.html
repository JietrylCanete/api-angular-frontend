<div class="card mt-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5>{{ title }}</h5>
    <button class="btn btn-secondary btn-sm" (click)="onBack()">← Back</button>
  </div>

  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label>Type</label>
        <select class="form-select" formControlName="type">
          <option value="">-- Select Type --</option>
          <option value="equipment">Equipment</option>
          <option value="leave">Leave</option>
          <option value="resources">Resources</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Items</label>
        <input type="text" formControlName="items" class="form-control" />
      </div>

      <div class="mb-3">
        <label>Quantity</label>
        <input type="number" formControlName="quantity" class="form-control" />
      </div>

      <div class="mb-3">
        <label>Status</label>
        <input type="text" formControlName="status" class="form-control" readonly />
      </div>

      <!-- Buttons only show if Draft -->
      <div *ngIf="currentStatus === 'draft'" class="text-end">
        <button type="submit" class="btn btn-primary me-2" [disabled]="loading">
          {{ isAddMode ? 'Create' : 'Update' }}
        </button>
        <button type="button" class="btn btn-success" (click)="onSubmit(true)" [disabled]="loading">
          Submit for Approval
        </button>
      </div>

      <!-- If not Draft, show notice -->
      <div *ngIf="!isAddMode && currentStatus !== 'draft'" class="alert alert-info mt-3">
        This request cannot be edited because its status is <strong>{{ currentStatus | uppercase }}</strong>.
      </div>
    </form>
  </div>
</div>
